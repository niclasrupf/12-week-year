function iso(d){return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
function add(s,n){var d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return iso(d)}
function mon(s){return add(s,-((new Date(s+"T12:00:00").getDay()+6)%7))}
function dayo(k){var o=S.days[k]||(S.days[k]={});o.c=o.c||{};o.n=o.n||{};return o}
function weeko(k){var o=S.weeks[k]||(S.weeks[k]={});o.c=o.c||{};o.n=o.n||{};return o}
var START="2026-09-28";
function dsince(){return Math.floor((new Date()-new Date(START+"T00:00:00"))/864e5)}
function wnum(w){return Math.floor((new Date(w+"T12:00:00")-new Date(START+"T12:00:00"))/6048e5)+1}
function cw(){return Math.max(1,Math.min(13,Math.floor(dsince()/7)+1))}
function lim(){var w=cw();return w<=4?{s:5.5,i:60}:w<=8?{s:4.5,i:45}:{s:4,i:30}}
function lw(){var r=[];Object.keys(S.days).sort().reverse().forEach(function(k){var n=S.days[k].n||{};["q1","sr"].forEach(function(x){(n[x]||"").split("\n").forEach(function(l){l=l.replace(/^\s*\+\s*/,"").replace(/^Szene:\s*/,"").trim();if(l&&r.length<3)r.push("\u2022 "+l)})})});return r.length?r.join("\n"):"Noch keine Wins notiert."}
function gl(k){var r="";Object.keys(S.weeks).sort().reverse().forEach(function(w){var v=(S.weeks[w].n||{})[k];if(!r&&v&&v.replace(/[\s+\d.:\-]/g,"").length>2)r=v});return r||"Noch nicht geschrieben (Woche-Tab, Wochen-Rituale)."}

var SC=["Arbon, offen\n\u2022 Wer steht wo: Nick hat den Ball, ich stehe offen.\n\u2022 Space: vor mir, der Gegner kommt von links.\n\u2022 Entscheidung: schön aufdrehen, voller Sprint. Kann ich nicht direkt mitnehmen: De-Jong-Turn.\nDetail: Wie ich den Fuss zurückziehe und der Ball voll in den Lauf geht.","Abtwil, vor der IV\n\u2022 Wer steht wo: Alban spielt zu Lionel, ich bin zwischen den beiden Zentrumspielern. Lionel schaut mich nicht an.\n\u2022 Space: Full Surrounding Scan: Was passiert hinter meiner Schulter? Critical Scan.\n\u2022 Entscheidung: Lionel spielt mir den Ball auf den linken Fuss. Direkt smooth mitnehmen, Go, den Space attackieren.","Arbon (Nikola), Halbfeld\n\u2022 Wer steht wo: Nikola rechts am Ball, ich zwischen Sechser und IV, der IV kommt hinter mir.\n\u2022 Space: Der Touch muss weg vom Verteidiger.\n\u2022 Entscheidung: Ball halb rechts auf den rechten Fuss. Hazard, Stop, Go: Innenseite annehmen, aussen weg, Go.\nDetail: Nach dem Outside-Kontakt Fuss rausstellen (extra Step outside).","Uzwil, Pietro RV\n\u2022 Wer steht wo: Alban, Pietro, er hält den Ball und spielt zu mir. Ich stehe zur Grundlinie, Gegner im Rücken.\n\u2022 Space: Schulterblick, freier Raum Richtung Tor.\n\u2022 Entscheidung: Linke Annahme, mit rechts sofort in den Raum mitnehmen, Tempo Richtung Tor.\nDetail: Adi und Pietro rufen und coachen. Ich strecke nach dem Kontakt mit rechts den Arm in den Raum.","Abziel, links aussen (Rabil)\n\u2022 Wer steht wo: Rabil hat den Ball und spielt ihn zurück auf meinen linken Fuss. Rechts von mir ist der Gegner. Ich bin am Rand der Box.\n\u2022 Space: Mitte, seitlich von mir.\n\u2022 Entscheidung: First Touch, Safe Turn wie Bellingham, Touch Richtung Mitte, sofort Schuss.","Abtwil, Silvano, hoher Ball\n\u2022 Wer steht wo: Alban hat den Ball, ich werde gedeckt. Fake-Go, ich komme entgegen. Der Ball geht weit, ich drehe mich um und spekuliere auf den zweiten Ball.\n\u2022 Space: Silvano hat ihn und legt ihn mir ab. Links höre ich Adi schreien, ich sehe Platz nach vorne.\n\u2022 Entscheidung: Ich gehe durch: erster Touch, Vollmitnahme, Space attackieren. Der erste IV kommt: Roll, doppelter Übersteiger rechts, weiterlaufen, schon von weit schiessen.","Abtwil, erste Szene, Kevin-De-Bruyne-Run\n\u2022 Wer steht wo: Ich laufe als 10er in den Halbraum zwischen Aussenverteidiger und Innenverteidiger. Der Ball kommt flach und steil vom Flügel.\n\u2022 Space: Ich scanne vor der Annahme.\n\u2022 Entscheidung: Ein Touch, Schuss voll unter die Ecke."];
var M=["Mut 1, Szene 1 (Uzwil): Rabil spielt mir den Ball in die Tiefe. Ich attackiere das Tor, höre die Rufe, bin egoistisch, Roll Drag rechts vorbei, schiesse selber.\nDetail: Ruf von Yannick, das Gefühl vom Innenkontakt (Innenseite), bevor ich den Gegner face.","Mut 1, Szene 2 (Amriswil): Links, ich nehme den Ball mit der Innenseite nach vorne und laufe den Gegner frontal an. Übersteiger rechts, links vorbei, Arme raus, Kopf hoch, Schuss mit links nach rechts unten. Ich sehe nur mich und das Tor.","Mut 2: Nick spielt mir den Ball, ich laufe in die Tiefe und scanne beim Run. Ich nehme mutig mit, sehe genau, wohin ich schiessen will, hebe einmal den Kopf und ziehe voll ab, mit Überzeugung.\nDetail: Nicks Ruf \u201eLos!\u201c und der erste Kontakt, der den Ball in den Lauf legt.","Mut 3, Szene 1: Ich bekomme den Ball im Zentrum, Körpertäuschung wie gegen Au, im Zentrum vorbei mit Tempo.","Mut 3, Szene 2: Ich bekomme den Ball von Yannick halbrechts im Zentrum (wie gegen Arbon). Packing, Fake-Flanke, ich lege mir den Ball vor und schiesse aus ca. 30 m (Position wie in Amriswil).\nDetail: Kopf hoch zum Tor, linke Ecke, das Gefühl, wie der Ball meinen vorderen rechten Zeh verlässt.","Reset 1: Ich habe den Ball gerade verloren, der Gegner schiesst daneben. Ich sage neutral, was passiert ist, ohne Wertung. Reset-Protokoll: ausatmen, lächeln, Fuck it. Keine Gestik, ich ignoriere Adis Rufe und hole mir den Ball in der nächsten Aktion. Bellingham-Turn nach dem Ball vom IV, Packing.\nDetail: Adis Stimme im Hintergrund, mein ruhiger Atem, der Blick zur nächsten Aktion.","Reset 2: Ich gehe von aussen ins Zentrum, Doppelstepover, verliere den Ball knapp. Reset-Protokoll. Ich bekomme den Ball gleich wieder, gehe an den zweien vorbei an der Linie, Elastico wie gegen Amriswil. Der dritte Gegner kommt: statt Pass zu Silvano mit Tempo weitergehen.\nDetail: Das Gefühl des Elastico am Aussenrist, Silvanos Ruf, den ich ignoriere."];
var TIPS="Realismus-Check, 10 Punkte:\n1. Bewegung vorher real durchgehen (Körpertäuschung, Turn)\n2. 20 Sek Video der Szene als Detail-Quelle\n3. Alle Sinne: sehen, hören, spüren, Rasen, Temperatur\n4. Aufrecht sitzen, Füsse flach, wenn möglich Schuhe an\n5. Spieltempo, Zeitlupe nur für neue Bewegungen\n6. Lieber eine scharfe Szene als fünf unscharfe\n7. Pro Woche ein Detail austauschen\n8. Neu: Gleiche Zeit und gleicher Ort jeden Abend (Anker)\n9. Neu: Erst das Körpergefühl, dann das Bild\n10. Neu: Stimme leise mitsprechen (Lippen bewegen)";
var PW="Sirnach: Hacken-Bewegung, locker. Schuss rechts oben. Pepe kommentiert mit der Lockerheit. Handshake mit dem Zuschauer nach dem Spiel.\n\nHorgen: Ich schaue hoch, rechts oben. Der Ball verlässt den vorderen rechten Zeh, locker und scharf. Tor, Schreie der Zuschauer. Touli nimmt mich zu sich. Nach dem Spiel meine Eltern und die Fanta. Kommentar im nächsten Training.\n\nBrugg: Durchlauf zum ersten Tor, 60-Meter-Run. Dodes Kommentar. Simon wegschicken, Freistoss schiessen. Mama draussen jubelt, ihr Kommentar.\n\nHSG: Tunnel, Elastico. Draussen \u201ewow\u201c. Sonderdeckung des anderen Spielers. \u201eDu bist zu gut ...\u201c\n\nKZU: Scognamiglios Reaktion, sein Blick. Andere Mitspieler genervt, Jay, weil ich den Glanz habe. Reaktion auf der Matura-Party.\n\nPro Win ein Detail mehr: wer, gesehen, gehört, Körper, Handlung, danach.";
var FEEL="Körper: locker.\nArroganz: das dreckige Lächeln, Fuck-you-Mentality, ich bin besser.\nFucking-Man-Feeling: ich weiss es, ich brauche keine Bestätigung, ihr müsst es mir nicht sagen, dazu das leichte Nicken.\nGleichgültigkeit: ich weiss, wer ich bin, ich habe alles erreicht, ich spiele für den Spass.\n\n(Dieser Block wird noch verfeinert.)";
var DEF="Ich stehe mit 80 Kilo, 8 Prozent Körperfett vor dem Spiegel. Meine Brust ist prall, meine Abs sind sichtbar. Ich bin explosiv und stark.\nIch bin der Fucking Man. Ich fordere und will jeden Ball. Ich gehe ins Dribbling, ich suche den Abschluss. Scheitern gehört dazu. Ich bin der, der das Spiel entscheidet.\nIch bin diszipliniert, routiniert und Locked In.";
function lastN(k,d){var r="";Object.keys(S.days).sort().reverse().forEach(function(x){var v=(S.days[x].n||{})[k];if(!r&&v&&x!=cur)r=v});return r||d}
function stkInfo(){var ks=Object.keys(S.days).sort(),run=0,prev=null,best=0,at={},last=null;ks.forEach(function(k){var y=(S.days[k].n||{}).st=="ja";if(y){run=(prev&&add(prev,1)==k)?run+1:1;at[k]=run;if(run>best)best=run;last=k;prev=k}else{run=0;prev=null}});var t=iso(new Date());return{c:(last&&last>=add(t,-1))?at[last]:0,b:best}}
function renderStk(){var i=stkInfo();document.getElementById("stkc").innerHTML='<h2>Streak</h2><div class="pct">Tag '+i.c+' von 28</div><div class="bar"><i style="width:'+Math.min(100,100*i.c/28)+'%"></i></div><div class="h">Bestwert: '+i.b+'. Am Abend entscheidest du, ob du den Tag übernimmst.</div>'}

var ANK="Pro Szene: Wer steht wo? Space? Entscheidung? Lies die Szene und visualisiere sie selber. Annahme ist Antritt (Touch / Go).";
var BH="Touch / Go (Bounce Hit): Im Kopf sagen, nicht laut. Touch = Annahme, Go = Antritt. Im Training darfst du es leise murmeln.";

var MG=["auf","hm","stk","tz"],PH=["tr","slp","kre","sko","es","bew"],MD=["dd","ank","ng","sm","ai"],AB=["tp","mob","fi","vs","tzr","jr","bet","bib"],FB=["fq","f3","fsc","zl"];
var PL={tr:"Training",slp:"Schlaf",kre:"Kreatin",sko:"Schwarzkümmelöl",es:"Kauen+Squats",bew:"Meals mit Intention"};
var R=[["r_tgt","TARGET umgesetzt"],["r_scan","SCAN: vor dem Ball gesehen"],["r_mut","MUT: sinnvolle Aktion gewagt"],["r_att","ATTACK: Raum und Gegner angegriffen"],["r_res","RESET: nach Aktionen sofort wieder da"],["r_ants","Gedanken (Vergleich, Angst) erkannt und weitergemacht"],["r_obs","Sachlich beobachtet statt bewertet"],["r_fan","Biggest Fan Voice gehört"]];
var CUE="Vor dem Spiel in Ruhe lesen (30 Sek):\nPositionskette: Position, Scan, Space, Attack. Ich positioniere mich aktiv: Wo kommt der Ball als Nächstes?\nSCAN: Ich sehe, bevor der Ball kommt.\nMUT: Ich wage die Aktion, wenn sie da ist.\nATTACK: Raum und Gegner angreifen.\nRESET: Nach jeder Aktion sofort wieder da.\nZonen: Vorne Ballverlust okay. Mitte nach dem Scan. Hinten sauber annehmen.\n\nFehler oder negativer Gedanke, immer derselbe Ablauf:\n1. Ausatmen und benennen (\u201eVergleich\u201c, \u201eAngst\u201c)\n2. Lächeln\n3. \u201eFuck it\u201c, nächste Aktion\nTeam-Anker: Ich nehme Verantwortung.\n\nIm Spiel zählen nur zwei Wörter:\nSEHEN: den Gegner beobachten (schwacher Fuss, Abstand, Blick), sachlich, ohne gut oder schlecht. Weg von mir selbst, hin zum Gegner.\nWEITER: Reset.\nDazu dein Mikro-Fokus aus dem Target.";
var TGT="Das Target ist EIN Verhalten, das du heute bewusst übst.\n\nHeute entscheide ich: Zuversicht ist eine Entscheidung, kein Gefühl (Rotella). Z.B. \u201eHeute zeige ich, dass ich den Ball verlange.\u201c\nBehaviour: Was tue ich? Z.B. \u201eIch greife an, wenn ich Raum habe.\u201c\nTrigger: Wann? Z.B. \u201eIch bekomme den Ball mit Raum vor mir.\u201c\nResponse: Was dann? Z.B. \u201eAnnahme ist Antritt, sofort auf den Gegner.\u201c\nMikro-Fokus: Worauf achte ich? Z.B. \u201eSchulterblick vor der Annahme.\u201c\n\nEin Wenn-dann ist entschieden, bevor die Angst mitredet. Nachher prüfst du nur: getan, ja oder nein?";
var OPF="Ein Opfersatz sagt, dass etwas ausserhalb von dir entscheidet, was du tust. Schreib einen, der dir heute begegnet ist, in \u201eIch werde\u201c um.\n\n\u2022 \u201eDer Trainer nimmt mich eh raus, darum spiele ich safe.\u201c wird zu \u201eIch nutze die nächste Chance.\u201c\n\u2022 \u201eAlban ist besser.\u201c wird zu \u201eIch nehme eine Sache von ihm mit und spiele meine nächste Aktion.\u201c\n\u2022 \u201eWenn ich den Ball verliere, halten mich alle für schlecht.\u201c wird zu \u201eIch kann den Ball verlieren und bleibe aktiv.\u201c\n\u2022 \u201eMeine Mitspieler passen mir nie.\u201c wird zu \u201eIch fordere laut und gehe in die Lücke.\u201c\n\u2022 \u201eIch bin zu müde zum Visualisieren.\u201c wird zu \u201eIch mache heute die 2-Minuten-Version.\u201c";
var AV="Im Stehen, Licht an, direkt nach dem Zähneputzen, früh im Abend, nicht im Bett. Zu müde? Sprich die Szenen einmal als Sprachmemo auf und hör sie. Minimal: 2 Min, 1 Szene.\n\nAblauf (5 Min):\n1. 4 ruhige Atemzüge, Augen zu\n2. Szene A (90 Sek), Szene B (90 Sek, an 2 Abenden pro Woche die Fehler-Version)\n3. Past Win mit Körpergefühl (60 Sek)\n4. Beweis-Satz einmal\n\nSo wird es realer:\n\u2022 Szene vor Satz: Handlung durchspielen, dann die Bedeutung\n\u2022 Ich-Perspektive, Spieltempo (Zeitlupe nur für neue Bewegungen)\n\u2022 Körper dabei: Kopf drehen, Gewicht auf den gegnerfernen Fuss. Neue Moves erst real üben\n\u2022 Konkrete Orte, Geräusche, Rasen\n\u2022 Mit 10 Sek Druck starten, offener Ausgang: klappt, oder Ball weg, dann ausatmen, lächeln, Fuck it, nächste Aktion\n\u2022 Emotion folgt den Details, sie darf kommen, ist aber nicht Bedingung\n\nDeine Szenen (Scanning alle 2-3 Tage hier, sonst vor dem Training):\n"+SC.join("\n")+"\n\n"+ANK;
var FS="Fehler plus ruhige Reaktion, 2x pro Woche statt der positiven Szene B. Auslöser, die du übst:\n\u2022 Alban macht eine starke Aktion\n\u2022 Der Trainer schaut kritisch\n\u2022 Ich verliere den Ball\n\u2022 Ich sitze auf der Bank\nAblauf: Gedanke benennen, ausatmen, lächeln, Fuck it, nächste Aktion. Eine Sache von Alban mitnehmen.";

var UI={},VZ=null,VT=null;
var WHY="Warum: Du übst Entscheidung und Gefühl vorher, damit sie im Spiel vertraut sind und deine Identität echte Szenen als Beweis bekommt. Ersetzt kein Training.\nWie: Ich-Perspektive, Spieltempo, Körper dabei, echter Ort, Gefühl in Brust, Hände, Beine, 10 Sek Druck, offener Ausgang. Der Start-Knopf führt dich durch.\nMüde? Im Stehen, Licht an, direkt nach dem Zähneputzen. 2-Min-Version oder Sprachmemo.";
function fmt(s){return Math.floor(s/60)+":"+("0"+s%60).slice(-2)}
var RULES="SHOW THEM: Ich will den Ball, ich will zeigen, dass ich der Beste bin. Ich biete mich an und übernehme Verantwortung.\nSCAN: Ich weiss vor dem Ball, was ich tue (Touch / Go).\nLEICHTIGKEIT: Ich spiele locker und egoistisch: dribbeln, schiessen, dribbeln, schiessen. Fehler? Fuck it.";
var ST={fb:[
